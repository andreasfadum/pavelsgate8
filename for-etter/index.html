<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Før og etter | Pavels gate 8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F4EE;
      --surface: #FFFFFF;
      --ink: #1D2B27;
      --muted: #5E6965;
      --line: #E4DFD4;
      --line-strong: #CFC8BA;
      --primary: #2F6B4F;
      --primary-hover: #25573F;
      --primary-soft: #E4EFE8;
      --focus: #1B4FD8;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --gutter: 16px;
      --reservert: 14.2rem;
    }
    * { box-sizing: border-box; }
    html { font-size: 17px; -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }

    .side { max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter); }

    /* Topp */
    .topp { display: flex; align-items: center; gap: .6rem; padding: .7rem 0 .55rem; }
    .merke {
      width: 2rem; height: 2rem; border-radius: 9px; background: var(--primary); color: #fff;
      display: grid; place-items: center; font-family: var(--serif); font-size: .85rem; font-weight: 600; flex: none;
    }
    h1 { margin: 0; font-size: 1rem; font-weight: 700; line-height: 1.2; }
    h1 span { display: block; color: var(--muted); font-size: .8rem; font-weight: 400; }

    /* Romknapper */
    .romvalg { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; padding-bottom: .7rem; }
    .gruppe { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
    .gruppe-navn { color: var(--muted); font-size: .8rem; margin-right: .1rem; }
    .gruppe-knapper { display: flex; flex-wrap: wrap; gap: .4rem; }
    .romknapp {
      font: inherit; font-size: .9rem; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line-strong); border-radius: 999px; padding: .36rem .85rem;
      min-height: 40px; cursor: pointer;
    }
    .romknapp:hover { background: var(--primary-soft); border-color: var(--primary); }
    .romknapp[aria-current="true"] { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 700; }
    .romknapp:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    /* Brytere: bytt funksjon mellom to rom */
    .brytere { display: flex; flex-wrap: wrap; gap: .4rem; width: 100%; }
    .bytteknapp {
      display: inline-flex; align-items: center; gap: .5rem;
      font: inherit; font-size: .9rem; font-weight: 700; color: var(--primary-hover); background: var(--primary-soft);
      border: 1px solid var(--primary); border-radius: 14px; padding: .3rem .85rem .3rem .55rem;
      text-align: left; line-height: 1.25;
      min-height: 40px; cursor: pointer;
    }
    .bytteknapp:hover { background: #D5E6DB; }
    .bryter-ord { display: block; }
    .forklaring { display: block; font-size: .78rem; font-weight: 400; color: var(--ink); }
    .bytteknapp:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .bryter { position: relative; width: 2.1rem; height: 1.2rem; border-radius: 999px; background: var(--muted); flex: none; transition: background .15s; }
    .bryter::after {
      content: ""; position: absolute; top: .15rem; left: .15rem; width: .9rem; height: .9rem;
      border-radius: 50%; background: #fff; transition: transform .15s;
    }
    .bytteknapp[aria-pressed="true"] .bryter { background: var(--primary); }
    .bytteknapp[aria-pressed="true"] .bryter::after { transform: translateX(.9rem); }
    @media (prefers-reduced-motion: reduce) { .bryter, .bryter::after { transition: none; } }

    /* Slider */
    .scene {
      --r: 1.333;
      --pos: 50%;
      position: relative; overflow: hidden; margin: 0 auto;
      aspect-ratio: var(--r);
      width: min(100%, calc(max(20rem, 100vh - var(--reservert)) * var(--r)));
      width: min(100%, calc(max(20rem, 100dvh - var(--reservert)) * var(--r)));
      background: #DDD8CC; border-radius: 12px;
      cursor: ew-resize; touch-action: pan-y; user-select: none; -webkit-user-select: none;
    }
    .lag { position: absolute; inset: 0; }
    .lag img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .lag-for { clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
    .merkelapp {
      position: absolute; top: .65rem; padding: .18rem .6rem; border-radius: 999px;
      background: rgba(29, 43, 39, .78); color: #fff; font-size: .82rem; white-space: nowrap;
    }
    .lag-for .merkelapp { left: .65rem; }
    .lag-etter .merkelapp { right: .65rem; }

    .skille { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 0; pointer-events: none; }
    .skille::before {
      content: ""; position: absolute; top: 0; bottom: 0; left: -1.5px; width: 3px;
      background: #fff; box-shadow: 0 0 6px rgba(0, 0, 0, .45);
    }
    .knott {
      position: absolute; top: 50%; left: 0; width: 46px; height: 46px; transform: translate(-50%, -50%);
      display: grid; place-items: center; border-radius: 50%;
      background: #fff; color: var(--ink); box-shadow: 0 1px 8px rgba(0, 0, 0, .4);
    }
    .knott svg { width: 28px; height: 28px; }
    .skyver {
      position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; padding: 0; overflow: hidden;
      left: var(--pos); top: 50%;
    }
    .skyver:focus-visible ~ .skille .knott { outline: 3px solid var(--focus); outline-offset: 2px; }

    /* Tekst under */
    .omtale { max-width: 46rem; margin: .7rem auto 0; }
    h2 { margin: 0 0 .15rem; font-family: var(--serif); font-size: 1.3rem; font-weight: 600; line-height: 1.25; }
    .omtale p { margin: 0; }
    .fot { max-width: 46rem; margin: 1rem auto 0; padding: .7rem 0 1.4rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .85rem; }

    @media (max-width: 640px) {
      :root { --reservert: 0rem; }
      .romvalg { gap: .35rem; }
      .gruppe { width: 100%; flex-wrap: nowrap; align-items: flex-start; }
      .gruppe-navn { width: 2.4rem; margin: 0; padding-top: .5rem; flex: none; }
      .scene { border-radius: 8px; }
      .merkelapp { font-size: .75rem; top: .45rem; }
      .lag-for .merkelapp { left: .45rem; }
      .lag-etter .merkelapp { right: .45rem; }
    }
  </style>
</head>
<body>
  <div class="side">
    <header class="topp">
      <span class="merke" aria-hidden="true">P8</span>
      <h1>Før og etter <span>Fellesarealene i Pavels gate 8</span></h1>
    </header>

    <nav class="romvalg" id="romvalg" aria-label="Velg areal"></nav>

    <main>
      <div class="scene" id="scene">
        <div class="lag lag-etter">
          <img id="bilde-etter" alt="" draggable="false">
          <span class="merkelapp" id="merkelapp-etter">Skisse, ikke bestemt</span>
        </div>
        <div class="lag lag-for">
          <img id="bilde-for" alt="" draggable="false">
          <span class="merkelapp">I dag</span>
        </div>
        <input class="skyver" id="skyver" type="range" min="0" max="100" step="1" value="50"
               aria-label="Skyv for å sammenligne bildet fra i dag med skissen">
        <div class="skille" aria-hidden="true">
          <div class="knott">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.5 7 4.5 12l5 5"/><path d="m14.5 7 5 5-5 5"/>
            </svg>
          </div>
        </div>
      </div>

      <section class="omtale" aria-live="polite">
        <h2 id="rom-tittel"></h2>
        <p id="rom-tekst"></p>
      </section>
    </main>

    <footer class="fot">
      Skyv streken mot venstre og høyre for å se forskjellen. Alle skissene er AI-bearbeidede foto. De viser en mulighet og er ikke bestemt. De to bryterne viser rommene med motsatt funksjon.
    </footer>
  </div>

  <script>
    var ROM = [
      {
        id: 'bakgard', gruppe: 'Ute', knapp: 'Forhagen nord', tittel: 'Forhagen nord', b: 1800, h: 1350,
        tekst: 'Pakkeboks bygget inn i muren, sykkeltak av glass og langbord med to benker. Brostein med åpne fuger slipper vannet gjennom, og ny beplantning skjermer mot naboene.',
        altFor: 'Forhagen nord i dag, med gressbakke, støttemur og busker.',
        altEtter: 'Skisse av forhagen nord med pakkeboks i muren, sykkeltak, langbord på brostein og ny beplantning.'
      },
      {
        id: 'inngang', gruppe: 'Ute', knapp: 'Inngangen', tittel: 'Inngangen', b: 1800, h: 1350,
        tekst: 'Bord og to benker med rygg, for rundt seks personer, på skiferheller koblet til hellene foran inngangen. Gress rundt sittegruppen og busker som skjermer leiligheten i første etasje.',
        altFor: 'Inngangen i dag, med heller, plen og hekk.',
        altEtter: 'Skisse av inngangen med bord og to benker på skiferheller, omgitt av gress og busker.'
      },
      {
        id: 'vaskerom', gruppe: 'Inne', knapp: 'Vaskerom', tittel: 'Vaskerom', b: 1800, h: 1208,
        tekst: 'Fullverdig vaskeri med maskiner og utslagsvask i rustfritt stål langs venstre vegg. Under vinduet er det bord for bretting og planter. Tørkestativ i taket og kurvhylle til tøy som venter.',
        altFor: 'Vaskerommet i dag, med vaskemaskin, tørketrommel, gammel vask og treplatting.',
        altEtter: 'Skisse av vaskerommet med blå vegger, hvitt gulv, maskiner og vask i stål, bord under vinduet, kurvhylle og høyt skap.',
        bytte: {
          par: 'vask', tittel: 'Vaskerom til beredskapsrom',
          tekst: 'Rommet brukt som husets beredskapsrom. Vannkanner i reoler langs venstre vegg, benk med stormkjøkken, pledd og soveposer under vinduet, og mat og hygieneartikler i reol mot bakveggen. Ingenting står direkte på gulvet. Vaskeriet er vist i fyrrommet.',
          altEtter: 'Skisse av rommet som beredskapsrom, med blå vegger, hvitt gulv, reoler med blå vannkanner til venstre, benk under vinduet og reol med mat og hygieneartikler.'
        }
      },
      {
        id: 'verksted', gruppe: 'Inne', knapp: 'Tørkerom', tittel: 'Tørkerom til verksted', b: 1800, h: 1617,
        tekst: 'Rommet brukt som felles verksted, med arbeidsbenk under vinduet, verktøyvegg, sykkelhjørne og hylle for gjenbruk. Innerrommet er lager for materialer. Tørking er vist i vaskerommet ved siden av.',
        altFor: 'Tørkerommet i dag, med langbord, gammel rulle og slitt betonggulv.',
        altEtter: 'Skisse av rommet som verksted, med blå vegger, hvitt gulv, arbeidsbenk, verktøyvegg og en sykkel i reparasjonsstativ.',
        bytte: {
          par: 'ved', tittel: 'Tørkerom til vedrom',
          tekst: 'Rommet brukt som felles vedrom, med høye hyller langs veggene, ved i nettsekker nederst og en lav hylle under vinduet. Innerrommet har hyller med ved på begge sider. Midt i rommet står et stort bord, og i taket henger et tørkestativ. Det er fri gulvflate rundt bordet, slik at det er plass til tralla.',
          altEtter: 'Skisse av rommet som vedrom, med blå vegger, hvitt gulv, høye hyller fulle av ved, nettsekker nederst, en et stort bord midt i rommet, en tralle lastet med ved og et tørkestativ i taket.'
        }
      },
      {
        id: 'vedbod-vindu', gruppe: 'Inne', knapp: 'Vedbod mot vinduet', tittel: 'Vedbod mot vinduet', b: 1310, h: 1708,
        tekst: 'Høye vedhyller, benk under vinduet og plass til tralle, vedbærere og kasser. Gule vegger og lyst gulv.',
        altFor: 'Vedboden i dag, mørk og full av utstyr foran trehyller.',
        altEtter: 'Skisse av vedboden med gule vegger, høye vedhyller, vindu og benk.',
        bytte: {
          par: 'ved', tittel: 'Vedbod til verksted, mot vinduet',
          tekst: 'Rommet brukt som felles verksted. Under vinduet er det plass til søm og lapping, med symaskin, skuffer og kasser med stoff. Til høyre står ski og staver fritt på veggen, så de er lette å løfte ut. Benken for smøring og reparasjon av sportsutstyr står videre langs samme vegg, utenfor bildet. Lukene i veggen holdes fri.',
          altEtter: 'Skisse av rommet som verksted, med gule vegger, symaskin på en benk under vinduet, krakk, skuffer og ski med staver som står fritt på veggen.'
        }
      },
      {
        id: 'vedbod-inngang', gruppe: 'Inne', knapp: 'Vedbod mot inngangen', tittel: 'Vedbod mot inngangen', b: 1800, h: 1350,
        tekst: 'Samme vedbod sett mot inngangsdøra. Høye hyller på begge sider, sekker med ved nederst og fri gang fram til døra.',
        altFor: 'Vedboden i dag sett mot den grønne døra, med trehyller, ved og poser.',
        altEtter: 'Skisse av vedboden med høye vedhyller på begge sider og fri gang fram til den grønne døra.',
        bytte: {
          par: 'ved', tittel: 'Vedbod til verksted, mot inngangen',
          tekst: 'Samme rom sett mot inngangsdøra. Til venstre er det sykkelhjørne med reparasjonsstativ, hjulstativ, pumpe og verktøy på veggen. Til høyre er det snekkerbenk med skruestikke, verktøytavle og hylle. Trappa og gangen fram til døra er fri.',
          altEtter: 'Skisse av rommet som verksted, med en sykkel i reparasjonsstativ til venstre og en snekkerbenk med verktøytavle og krakker til høyre, og fri gang fram til den grønne døra.'
        }
      },
      {
        id: 'fyrrom', gruppe: 'Inne', knapp: 'Fyrrom', tittel: 'Fyrrom til beredskapsrom', b: 1800, h: 1339,
        tekst: 'Beredskapslageret er vedtatt, men plasseringen er ikke avgjort. Her er det vist i fyrrommet, med vann i 10-liters kanner under vinduet, mat og hygieneartikler ved døra, og varme, lys og førstehjelp ved den murte sokkelen. Ingenting står på gulvet. Rommet må først sikres mot kloakk.',
        altFor: 'Fyrrommet i dag, med grønn dør, murt sokkel med brostein, trebukker, rør og flekkete vegger.',
        altEtter: 'Skisse av fyrrommet som beredskapsrom, med hvite vegger, lysegrått gulv, reoler med blå vannkanner under vinduet, reol med mat og hygieneartikler ved den grønne døra, og pledd, soveposer, radioer, lanterner og førstehjelpsskap ved den hvite sokkelen.',
        bytte: {
          par: 'vask', tittel: 'Fyrrom til vaskerom',
          tekst: 'Rommet brukt som vaskerom, med vaskemaskin, tørketrommel og utslagsvask i stål langs høyre vegg. Den murte sokkelen har fått eikeplate til bretting, og på veggen er det tørkestativ, strykebrett og hyller. Høyt skap til venstre for døra. Sikring mot kloakk må på plass først.',
          altEtter: 'Skisse av fyrrommet som vaskerom, med hvite vegger, maskiner og vask i stål, eikeplate på sokkelen, tralle med tøypose og høyt hvitt skap.'
        }
      }
    ];

    var scene = document.getElementById('scene');
    var skyver = document.getElementById('skyver');
    var bildeFor = document.getElementById('bilde-for');
    var bildeEtter = document.getElementById('bilde-etter');
    var romvalg = document.getElementById('romvalg');
    var knapper = {};
    var sisteValg = 0;
    var gjeldende = null;
    var PAR = [
      { id: 'ved', tekst: 'Bytt tørkerom og vedbod', start: 'verksted',
        vanlig: 'Nå: verksted i tørkerommet, ved i vedboden', byttet: 'Nå: ved i tørkerommet, verksted i vedboden' },
      { id: 'vask', tekst: 'Bytt vaskerom og fyrrom', start: 'vaskerom',
        vanlig: 'Nå: vaskeri i vaskerommet, beredskap i fyrrommet', byttet: 'Nå: beredskap i vaskerommet, vaskeri i fyrrommet' }
    ];
    var byttet = {};
    (new URLSearchParams(location.search).get('byttet') || '').split(',').forEach(function (id) {
      if (PAR.some(function (p) { return p.id === id; })) byttet[id] = true;
    });
    var brytere = {};

    function kilde(rom, del) { return 'bilder/' + rom.id + '-' + del + '.jpg'; }

    // Tekst og bilde for rommet slik det vises nå, med eller uten byttet funksjon
    function erByttet(rom) { return !!(rom.bytte && byttet[rom.bytte.par]); }
    function visning(rom) { return erByttet(rom) ? rom.bytte : rom; }
    function etterKilde(rom) { return kilde(rom, erByttet(rom) ? 'bytte' : 'etter'); }
    function adresse(rom) {
      var aktive = PAR.filter(function (p) { return byttet[p.id]; }).map(function (p) { return p.id; }).join(',');
      return location.pathname + (aktive ? '?byttet=' + aktive : '') + '#' + rom.id;
    }

    function oppdaterBrytere() {
      PAR.forEach(function (p) {
        brytere[p.id].setAttribute('aria-pressed', byttet[p.id] ? 'true' : 'false');
        brytere[p.id].querySelector('.forklaring').textContent = byttet[p.id] ? p.byttet : p.vanlig;
      });
    }

    function settPosisjon(prosent) {
      var p = Math.max(0, Math.min(100, prosent));
      scene.style.setProperty('--pos', p + '%');
      skyver.value = Math.round(p);
      skyver.setAttribute('aria-valuetext', Math.round(p) + ' prosent av bildet viser i dag');
    }

    function forhandslast(url) {
      return new Promise(function (ferdig) {
        var b = new Image();
        b.onload = b.onerror = ferdig;
        b.src = url;
        setTimeout(ferdig, 1500); // Treg linje: vis bildet mens det lastes
      });
    }

    function visRom(id, oppdaterAdresse, beholdPosisjon) {
      var rom = ROM.filter(function (r) { return r.id === id; })[0] || ROM[0];
      var valg = ++sisteValg;
      var vis = visning(rom);
      gjeldende = rom;
      Object.keys(knapper).forEach(function (k) {
        if (k === rom.id) knapper[k].setAttribute('aria-current', 'true');
        else knapper[k].removeAttribute('aria-current');
      });
      if (oppdaterAdresse) history.replaceState(null, '', adresse(rom));
      document.title = vis.tittel + ': før og etter | Pavels gate 8';
      document.getElementById('rom-tittel').textContent = vis.tittel;
      document.getElementById('rom-tekst').textContent = vis.tekst;

      Promise.all([forhandslast(kilde(rom, 'for')), forhandslast(etterKilde(rom))]).then(function () {
        if (valg !== sisteValg) return;
        scene.style.setProperty('--r', rom.b / rom.h);
        bildeFor.src = kilde(rom, 'for');
        bildeFor.alt = rom.altFor;
        bildeEtter.src = etterKilde(rom);
        bildeEtter.alt = vis.altEtter;
        document.getElementById('merkelapp-etter').textContent =
          erByttet(rom) ? 'Byttet om: skisse, ikke bestemt' : 'Skisse, ikke bestemt';
        if (!beholdPosisjon) settPosisjon(50);
      });
    }

    // Romknapper, gruppert i ute og inne
    ['Ute', 'Inne'].forEach(function (navn) {
      var gruppe = document.createElement('div');
      gruppe.className = 'gruppe';
      gruppe.setAttribute('role', 'group');
      gruppe.setAttribute('aria-label', navn);
      var etikett = document.createElement('span');
      etikett.className = 'gruppe-navn';
      etikett.textContent = navn;
      etikett.setAttribute('aria-hidden', 'true');
      gruppe.appendChild(etikett);
      var rad = document.createElement('div');
      rad.className = 'gruppe-knapper';
      gruppe.appendChild(rad);
      ROM.filter(function (r) { return r.gruppe === navn; }).forEach(function (rom) {
        var k = document.createElement('button');
        k.type = 'button';
        k.className = 'romknapp';
        k.textContent = rom.knapp;
        k.addEventListener('click', function () { visRom(rom.id, true); });
        knapper[rom.id] = k;
        rad.appendChild(k);
      });
      romvalg.appendChild(gruppe);
    });

    // Brytere: viser to rom med motsatt funksjon. Står du i et annet rom, hopper siden til det første i paret.
    var bryterRad = document.createElement('div');
    bryterRad.className = 'brytere';
    PAR.forEach(function (p) {
      var knapp = document.createElement('button');
      knapp.type = 'button';
      knapp.className = 'bytteknapp';
      var bryter = document.createElement('span');
      bryter.className = 'bryter';
      bryter.setAttribute('aria-hidden', 'true');
      knapp.appendChild(bryter);
      var ord = document.createElement('span');
      ord.className = 'bryter-ord';
      ord.textContent = p.tekst;
      var forklaring = document.createElement('span');
      forklaring.className = 'forklaring';
      ord.appendChild(forklaring);
      knapp.appendChild(ord);
      knapp.addEventListener('click', function () {
        byttet[p.id] = !byttet[p.id];
        oppdaterBrytere();
        var iParet = gjeldende.bytte && gjeldende.bytte.par === p.id;
        if (byttet[p.id] && !iParet) visRom(p.start, true);
        else visRom(gjeldende.id, true, true);
      });
      brytere[p.id] = knapp;
      bryterRad.appendChild(knapp);
    });
    romvalg.appendChild(bryterRad);
    oppdaterBrytere();

    // Dra med mus eller finger. Loddrett sveip på mobil ruller siden som vanlig.
    function fraPeker(e) {
      var boks = scene.getBoundingClientRect();
      settPosisjon((e.clientX - boks.left) / boks.width * 100);
    }
    var drar = false;
    scene.addEventListener('pointerdown', function (e) {
      drar = true;
      scene.setPointerCapture(e.pointerId);
      fraPeker(e);
      e.preventDefault();
    });
    scene.addEventListener('pointermove', function (e) { if (drar) fraPeker(e); });
    scene.addEventListener('pointerup', function () { drar = false; });
    scene.addEventListener('pointercancel', function () { drar = false; });

    // Piltaster via den skjulte skyveren
    skyver.addEventListener('input', function () { settPosisjon(Number(skyver.value)); });

    window.addEventListener('hashchange', function () { visRom(location.hash.slice(1), false); });
